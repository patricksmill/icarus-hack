[package]
name = "kiutrace"
version = "0.1.0"
edition = "2021"

[dependencies]
zakuro-core = { path = "../zakuro/crates/zakuro-core" }
zakuro-common = { path = "../zakuro/crates/zakuro-common" }
zakuro-cpu = { path = "../zakuro/crates/zakuro-cpu" }
zakuro-gpu = { path = "../zakuro/crates/zakuro-gpu", features = ["vulkan"] }
env_logger = "0.11"

[profile.release]
debug = 1

[patch."https://github.com/fearkov/3dsrecomp"]
recomp-abi = { path = "../3dsrecomp/abi" }
